<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Living Universe</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    display: block;
}
</style>
</head>

<body>
<canvas id="world"></canvas>

<script>
const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const AGENT_COUNT = 150;

const agents = [];

function random(min, max) {
    return min + Math.random() * (max - min);
}

for (let i = 0; i < AGENT_COUNT; i++) {
    agents.push({
        x: random(0, canvas.width),
        y: random(0, canvas.height),

        vx: random(-1, 1),
        vy: random(-1, 1),

        age: 0,

        memory: {
            socialExperience: 0
        },

        curiosity: random(0.2, 1.0),
        sociability: random(0.2, 1.0)
    });
}

function updateAgent(agent) {

    agent.age++;

    let neighbors = 0;
    let centerX = 0;
    let centerY = 0;

    for (let other of agents) {

        if (other === agent) continue;

        let dx = other.x - agent.x;
        let dy = other.y - agent.y;

        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 80) {
            neighbors++;
            centerX += other.x;
            centerY += other.y;
        }
    }

    if (neighbors > 0) {

        centerX /= neighbors;
        centerY /= neighbors;

        let dx = centerX - agent.x;
        let dy = centerY - agent.y;

        agent.memory.socialExperience =
            agent.memory.socialExperience * 0.995 +
            neighbors * 0.005;

        let attraction =
            0.001 +
            agent.sociability * 0.01 +
            agent.memory.socialExperience * 0.0002;

        agent.vx += dx * attraction;
        agent.vy += dy * attraction;
    }

    let wanderStrength = 0.15 * agent.curiosity;

    agent.vx += random(-wanderStrength, wanderStrength);
    agent.vy += random(-wanderStrength, wanderStrength);

    let speedLimit = 2.5;

    let speed = Math.sqrt(
        agent.vx * agent.vx +
        agent.vy * agent.vy
    );

    if (speed > speedLimit) {
        agent.vx = agent.vx / speed * speedLimit;
        agent.vy = agent.vy / speed * speedLimit;
    }

    agent.vx *= 0.98;
    agent.vy *= 0.98;

    agent.x += agent.vx;
    agent.y += agent.vy;

    if (agent.x < 0) agent.x += canvas.width;
    if (agent.x > canvas.width) agent.x -= canvas.width;

    if (agent.y < 0) agent.y += canvas.height;
    if (agent.y > canvas.height) agent.y -= canvas.height;
}

function drawAgent(agent) {

    let social = Math.min(
        1,
        agent.memory.socialExperience / 10
    );

    let blue = Math.floor(255 * social);
    let red = Math.floor(255 * (1 - social));

    ctx.beginPath();
    ctx.arc(agent.x, agent.y, 3, 0, Math.PI * 2);

    ctx.fillStyle = `rgb(${red},100,${blue})`;
    ctx.fill();
}

function update() {
    for (let agent of agents) {
        updateAgent(agent);
    }
}

function draw() {

    ctx.fillStyle = "rgba(0,0,0,0.08)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let agent of agents) {
        drawAgent(agent);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
