<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Living Universe</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:black;
    width:100%;
    height:100%;
}

canvas{
    display:block;
}

#chapter{
    position:absolute;
    top:15px;
    left:15px;

    color:white;
    font-family:Georgia,serif;
    font-size:18px;

    opacity:.8;
    pointer-events:none;
}
</style>
</head>

<body>

<div id="chapter"></div>

<canvas id="world"></canvas>

<script>

/*
===============================================================================

THE LIVING UNIVERSE

MISSION

Create an infinite sequence of discoveries.

The viewer should continuously move through:

    understanding
    ↓
    uncertainty
    ↓
    discovery
    ↓
    understanding

The simulation exists solely to create opportunities
for revelation.

===============================================================================

NARRATIVE CELL

Stillness
↓
Disturbance
↓
Curiosity
↓
Learning
↓
Connection
↓
Crisis
↓
Adaptation
↓
Harmony
↓
Transcendence

Transcendence becomes the beginning
of the next story.

===============================================================================

GUIDING PRINCIPLE

An audience can't appreciate learning
until they can observe adaptation.

Adaptation must be visible.

Every chapter must be recognizable.

===============================================================================
*/

const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");

const chapterLabel = document.getElementById("chapter");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}

resize();
addEventListener("resize", resize);

const AGENTS = [];
const COUNT = 250;

for(let i=0;i<COUNT;i++){

    AGENTS.push({

        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,

        vx:0,
        vy:0,

        learnedDX:0,
        learnedDY:0,

        age:Math.random()*1000

    });

}

const chapters = [

["Stillness",8000],
["Disturbance",8000],
["Curiosity",10000],
["Learning",10000],
["Connection",10000],
["Crisis",7000],
["Adaptation",10000],
["Harmony",10000],
["Transcendence",10000]

];

let chapterIndex = 0;
let chapterStart = performance.now();
let crisisTriggered = false;

function currentChapter(){

    return chapters[chapterIndex][0];

}

function nextChapter(){

    chapterIndex++;

    if(chapterIndex >= chapters.length){
        chapterIndex = 0;
    }

    chapterStart = performance.now();
    crisisTriggered = false;

}

function updateChapter(now){

    const chapter = chapters[chapterIndex];

    if(now - chapterStart > chapter[1]){
        nextChapter();
    }

    chapterLabel.innerText = currentChapter();
}

function centerX(){
    return canvas.width/2;
}

function centerY(){
    return canvas.height/2;
}

function updateAgents(){

    const chapter = currentChapter();

    AGENTS.forEach((a,index)=>{

        a.age++;

        switch(chapter){

            case "Stillness":

                a.vx *= .98;
                a.vy *= .98;

                a.vx += Math.sin(a.age*.01)*0.002;
                a.vy += Math.cos(a.age*.01)*0.002;

                break;

            case "Disturbance":

                a.vx += (Math.random()-.5)*2;
                a.vy += (Math.random()-.5)*2;

                break;

            case "Curiosity":

                a.vx += (Math.random()-.5)*0.15;
                a.vy += (Math.random()-.5)*0.15;

                break;

            case "Learning":

                /*
                Observable adaptation:
                agents remember beneficial direction.
                */

                a.learnedDX += (Math.random()-.5)*0.02;
                a.learnedDY += (Math.random()-.5)*0.02;

                a.vx += a.learnedDX;
                a.vy += a.learnedDY;

                break;

            case "Connection":

                let neighbors = 0;
                let avgX = 0;
                let avgY = 0;

                for(let b of AGENTS){

                    if(a === b) continue;

                    const dx = b.x-a.x;
                    const dy = b.y-a.y;

                    const d = Math.hypot(dx,dy);

                    if(d < 80){

                        avgX += b.x;
                        avgY += b.y;

                        neighbors++;

                    }
                }

                if(neighbors){

                    avgX/=neighbors;
                    avgY/=neighbors;

                    a.vx += (avgX-a.x)*0.0008;
                    a.vy += (avgY-a.y)*0.0008;
                }

                break;

            case "Crisis":

                if(!crisisTriggered){

                    crisisTriggered = true;

                    AGENTS.forEach(agent=>{

                        const dx = agent.x-centerX();
                        const dy = agent.y-centerY();

                        const d = Math.max(
                            Math.hypot(dx,dy),
                            1
                        );

                        agent.vx += dx/d*15;
                        agent.vy += dy/d*15;

                    });

                }

                break;

            case "Adaptation":

                a.vx *= .96;
                a.vy *= .96;

                a.vx += Math.sin(index*.4)*0.05;
                a.vy += Math.cos(index*.4)*0.05;

                break;

            case "Harmony":

                const circleAngle =
                    (index/COUNT)*Math.PI*2;

                const targetX =
                    centerX() +
                    Math.cos(circleAngle)*220;

                const targetY =
                    centerY() +
                    Math.sin(circleAngle)*220;

                a.vx += (targetX-a.x)*0.002;
                a.vy += (targetY-a.y)*0.002;

                break;

            case "Transcendence":

                const spiralAngle =
                    (index*.18)+(performance.now()*0.001);

                const radius =
                    index * 1.25;

                const spiralX =
                    centerX() +
                    Math.cos(spiralAngle)*radius;

                const spiralY =
                    centerY() +
                    Math.sin(spiralAngle)*radius;

                a.vx += (spiralX-a.x)*0.0015;
                a.vy += (spiralY-a.y)*0.0015;

                break;
        }

        a.vx *= .98;
        a.vy *= .98;

        a.x += a.vx;
        a.y += a.vy;

        if(a.x<0)a.x+=canvas.width;
        if(a.x>canvas.width)a.x-=canvas.width;

        if(a.y<0)a.y+=canvas.height;
        if(a.y>canvas.height)a.y-=canvas.height;

    });

}

function drawConnections(){

    ctx.strokeStyle="rgba(100,180,255,.15)";
    ctx.lineWidth=1;

    for(let i=0;i<AGENTS.length;i++){

        const a = AGENTS[i];

        for(let j=i+1;j<AGENTS.length;j++){

            const b = AGENTS[j];

            const d = Math.hypot(
                a.x-b.x,
                a.y-b.y
            );

            if(d < 50){

                ctx.beginPath();

                ctx.moveTo(a.x,a.y);
                ctx.lineTo(b.x,b.y);

                ctx.stroke();
            }
        }
    }
}

function draw(){

    ctx.fillStyle="rgba(0,0,0,.09)";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const chapter = currentChapter();

    if(chapter==="Connection"){
        drawConnections();
    }

    let color="#ffffff";

    if(chapter==="Disturbance") color="#ff9944";
    if(chapter==="Curiosity") color="#ffee66";
    if(chapter==="Learning") color="#66ff88";
    if(chapter==="Connection") color="#44ccff";
    if(chapter==="Crisis") color="#ff3333";
    if(chapter==="Adaptation") color="#cc88ff";
    if(chapter==="Harmony") color="#ffffff";
    if(chapter==="Transcendence") color="#88ffff";

    for(let a of AGENTS){

        ctx.beginPath();

        ctx.arc(
            a.x,
            a.y,
            2.5,
            0,
            Math.PI*2
        );

        ctx.fillStyle=color;
        ctx.fill();
    }

}

function loop(now){

    updateChapter(now);

    updateAgents();

    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>

</body>
</html>
