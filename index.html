<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The Living Universe</title>

<style>
html, body {
    margin:0;
    overflow:hidden;
    background:black;
    width:100%;
    height:100%;
}

canvas {
    display:block;
}

#chapter {
    position:absolute;
    top:20px;
    left:20px;

    color:white;
    font-family:Georgia, serif;
    font-size:18px;
    opacity:.75;

    pointer-events:none;
}
</style>
</head>

<body>

<div id="chapter"></div>
<canvas id="world"></canvas>

<script>

/*
===============================================================================

THE LIVING UNIVERSE

This is not a particle system.

This is an experiment in narrative emergence.

The viewer should continuously cycle through:

    understanding
        ↓
    uncertainty
        ↓
    discovery
        ↓
    understanding

Every phase of the universe exists to create opportunities
for revelation.

===============================================================================

NARRATIVE CELL

    Stillness
        ↓
    Disturbance
        ↓
    Curiosity
        ↓
    Learning
        ↓
    Connection
        ↓
    Crisis
        ↓
    Adaptation
        ↓
    Harmony
        ↓
    Transcendence

===============================================================================
*/

const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");
const chapterText = document.getElementById("chapter");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

const agents = [];

const AGENT_COUNT = 300;

for(let i=0;i<AGENT_COUNT;i++){

    agents.push({

        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,

        vx:0,
        vy:0,

        memory:0,
        age:0

    });

}

const chapters = [

{
    name:"Stillness",
    duration:10000
},

{
    name:"Disturbance",
    duration:10000
},

{
    name:"Curiosity",
    duration:15000
},

{
    name:"Learning",
    duration:15000
},

{
    name:"Connection",
    duration:15000
},

{
    name:"Crisis",
    duration:10000
},

{
    name:"Adaptation",
    duration:15000
},

{
    name:"Harmony",
    duration:15000
},

{
    name:"Transcendence",
    duration:10000
}

];

let chapterIndex = 0;
let chapterStart = performance.now();

function nextChapter(){

    chapterIndex++;

    if(chapterIndex >= chapters.length){

        chapterIndex = 0;

        for(const agent of agents){

            agent.memory *= .6;

        }

    }

    chapterStart = performance.now();
}

function currentChapter(){

    return chapters[chapterIndex];

}

function updateChapter(now){

    const chapter = currentChapter();

    if(now - chapterStart > chapter.duration){

        nextChapter();

    }

    chapterText.textContent =
        chapter.name;

}

function updateAgents(chapter){

    for(const a of agents){

        a.age++;

        switch(chapter.name){

            case "Stillness":

                a.vx *= .98;
                a.vy *= .98;

                break;

            case "Disturbance":

                a.vx += (Math.random()-.5)*1.5;
                a.vy += (Math.random()-.5)*1.5;

                break;

            case "Curiosity":

                a.vx += (Math.random()-.5)*.3;
                a.vy += (Math.random()-.5)*.3;

                break;

            case "Learning":

                a.memory += .02;

                a.vx *= 1.01;
                a.vy *= 1.01;

                break;

            case "Connection":

                let cx = 0;
                let cy = 0;
                let count = 0;

                for(const b of agents){

                    if(a === b) continue;

                    const dx = b.x-a.x;
                    const dy = b.y-a.y;

                    const d = Math.sqrt(dx*dx+dy*dy);

                    if(d < 100){

                        count++;

                        cx += b.x;
                        cy += b.y;

                    }
                }

                if(count){

                    cx /= count;
                    cy /= count;

                    a.vx += (cx-a.x)*0.0008;
                    a.vy += (cy-a.y)*0.0008;

                }

                break;

            case "Crisis":

                a.vx += (Math.random()-.5)*4;
                a.vy += (Math.random()-.5)*4;

                break;

            case "Adaptation":

                a.vx *= .97;
                a.vy *= .97;

                break;

            case "Harmony":

                const targetX =
                    canvas.width/2 +
                    Math.cos(a.age*.01)*250;

                const targetY =
                    canvas.height/2 +
                    Math.sin(a.age*.01)*250;

                a.vx += (targetX-a.x)*0.0004;
                a.vy += (targetY-a.y)*0.0004;

                break;

            case "Transcendence":

                a.vx +=
                    Math.cos(a.age*.02)*0.03;

                a.vy +=
                    Math.sin(a.age*.02)*0.03;

                break;

        }

        a.x += a.vx;
        a.y += a.vy;

        if(a.x < 0) a.x += canvas.width;
        if(a.x > canvas.width) a.x -= canvas.width;

        if(a.y < 0) a.y += canvas.height;
        if(a.y > canvas.height) a.y -= canvas.height;
    }
}

function draw(chapter){

    ctx.fillStyle = "rgba(0,0,0,.08)";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    for(const a of agents){

        let color = "#ffffff";

        switch(chapter.name){

            case "Stillness":
                color="#666666";
                break;

            case "Disturbance":
                color="#ff5533";
                break;

            case "Curiosity":
                color="#ffaa44";
                break;

            case "Learning":
                color="#99ff44";
                break;

            case "Connection":
                color="#44ccff";
                break;

            case "Crisis":
                color="#ff2222";
                break;

            case "Adaptation":
                color="#bb66ff";
                break;

            case "Harmony":
                color="#ffffff";
                break;

            case "Transcendence":
                color="#88ffff";
                break;
        }

        ctx.beginPath();

        ctx.arc(
            a.x,
            a.y,
            2.5,
            0,
            Math.PI*2
        );

        ctx.fillStyle = color;
        ctx.fill();
    }
}

function loop(now){

    updateChapter(now);

    const chapter =
        currentChapter();

    updateAgents(chapter);

    draw(chapter);

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>

</body>
</html>
